# One <6 h hop of the Windows build. Checks out helium-windows (pinned to the Helium version our
# patches are based on) at the workspace root so its own actions work unchanged, with this repo
# in heliumpp/. Its stage action resumes from the previous hop's build-tree artifact.
name: Windows stage
on:
  workflow_call:
    inputs:
      from-artifact:
        required: true
        type: boolean
      final:
        description: Last chance to package; fail if the build is not finished
        required: false
        type: boolean
        default: false
      resume-run:
        description: Run id whose saved build tree to start from (first hop only)
        required: false
        type: string
        default: ''
      resume-patches:
        description: Space-separated patches/ files to apply on top of that tree
        required: false
        type: string
        default: ''
    outputs:
      finished:
        value: ${{ jobs.stage.outputs.finished }}
      packaged:
        value: ${{ jobs.stage.outputs.packaged }}
permissions:
  contents: read
  actions: read  # resume-run: download another run's artifact
jobs:
  stage:
    runs-on: windows-2025
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
      packaged: ${{ steps.package.outputs.packaged }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: imputnet/helium-windows
          ref: 11a292ea63c107e8ed7f5edb5883df10f977b845  # Helium 0.19.4.1 (helium-chromium 832faa7)
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: heliumpp
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bonjourr
          path: heliumpp/build/bonjourr
      - name: Hook Helium++ into build.py
        run: python heliumpp/windows/hook_build_py.py build.py
      # Helium builds on 64-core Depot runners; a free runner's disk filled up at step 15k of 79k
      # with symbol_level=1. ungoogled-chromium-windows (free runners, same staging) uses 0.
      - name: No debug symbols (fits a free runner's disk)
        run: |
          $f = 'flags.windows.gn'
          $t = (Get-Content $f) -replace '^symbol_level=1$', 'symbol_level=0'
          if (-not ($t -contains 'symbol_level=0')) { throw "${f}: symbol_level=1 not found" }
          Set-Content $f $t
          Get-PSDrive C, D | Format-Table Name, @{n='FreeGB'; e={[int]($_.Free / 1GB)}}
      - uses: ./.github/actions/prepare-environment
      # The tree (21 GB after one stage) and its hand-off zip did not both fit on C: (31 GB free);
      # D: has ~147 GB. A junction from C: broke siso ("The system cannot find the path
      # specified"), so the tree lives at a real D: path and the stage action is pointed there.
      - name: Build tree on drive D
        run: |
          Copy-Item -Path C:\helium-windows -Destination D:\helium-windows -Recurse
          Remove-Item C:\helium-windows -Recurse -Force
          $f = '.github\actions\stage\index.js'
          $t = (Get-Content -Raw $f).Replace('C:\\helium-windows', 'D:\\helium-windows')
          if ($t.Contains('C:\\helium-windows') -or -not $t.Contains('D:\\helium-windows')) { throw "${f}: path swap failed" }
          Set-Content $f $t -NoNewline
      # build.py --ci skips all setup when build\src exists and goes straight to compiling, so an
      # earlier run's tree plus new patches only recompiles what the patches touch.
      - uses: actions/download-artifact@v4
        if: inputs.resume-run != ''
        with:
          name: build-artifact-x86_64
          run-id: ${{ inputs.resume-run }}
          github-token: ${{ github.token }}
          path: D:\helium-windows\build
      - name: Resume the earlier tree
        if: inputs.resume-run != ''
        working-directory: D:\helium-windows\build
        env:
          PATCHES: ${{ inputs.resume-patches }}
        run: |
          7z x artifacts.zip -y | Select-Object -Last 3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item artifacts.zip
          foreach ($p in $env:PATCHES.Split(' ', [StringSplitOptions]::RemoveEmptyEntries)) {
            src\third_party\git\usr\bin\patch.exe -p1 -d src -i "D:\helium-windows\heliumpp\patches\$p"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - uses: ./.github/actions/stage
        id: stage
        with:
          from_artifact: ${{ inputs.from-artifact }}
          package_here: true
          save_artifact: ${{ !inputs.final }}
      # The stage action only logs a failed hand-off; without the zip the next stage has nothing.
      - name: Check hand-off saved
        if: ${{ !inputs.final && steps.stage.outputs.finished != 'true' && steps.stage.outputs.package_here != 'true' }}
        run: if (-not (Test-Path D:\helium-windows\artifacts.zip)) { throw 'Build tree zip missing, see the stage log' }
      - name: Check build completed
        if: inputs.final && steps.stage.outputs.finished != 'true'
        run: throw 'Build did not finish within the available stages'
      - name: Package (unsigned)
        id: package
        if: steps.stage.outputs.package_here == 'true' || (inputs.final && steps.stage.outputs.finished == 'true')
        working-directory: D:\helium-windows
        run: |
          python heliumpp\windows\make_packages.py . C:\heliumpp-out
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "packaged=true" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.packaged == 'true'
        with:
          name: heliumpp-windows-x64
          path: C:\heliumpp-out\*
          if-no-files-found: error
          compression-level: 0
