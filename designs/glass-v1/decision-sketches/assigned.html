<!doctype html><html><head><meta charset="utf-8"><title>sketch</title><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden;font:13px/1.3 system-ui,sans-serif}
body{background:#1b2a2c;color:#e4efe9}

.bar{display:flex;gap:2px;align-items:center;height:36px;border-radius:12px;background:#2d474a;padding:0 8px}

nav{flex:1;display:flex;flex-direction:column;gap:3px;padding-top:4px}

.dots .on{background:#e0a95a;color:#1b2a2c;font-weight:700}.foot{text-align:center;letter-spacing:10px;opacity:.7}
