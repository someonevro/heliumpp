<!doctype html><html><head><meta charset="utf-8"><title>sketch</title><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden;font:13px/1.3 system-ui,sans-serif}
body{background:#0e1a3a;color:#eef3ff}
aside{position:absolute;left:0;top:0;bottom:0;width:236px;padding:14px;background:#12224a;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;gap:2px;align-items:center;height:36px;border-radius:6px;background:#1b3068;padding:0 8px;border:1px solid #3a5aa8}
.bar u{text-decoration:none;opacity:.85;width:22px;text-align:center}.bar em{flex:1;font-style:normal;padding-left:6px;font-size:12px}
nav{flex:1;display:flex;flex-direction:column;padding:6px 0 0 14px;border-left:6px solid #e5432f;margin-left:8px}
.tab{height:36px;display:flex;align-items:center;gap:10px;padding:0 10px;position:relative}
.tab::before{content:"";position:absolute;left:-22px;width:14px;height:14px;border-radius:50%;background:#12224a;border:3px solid #fff}
.tab i{display:none}.act{font-weight:700}.act::before{background:#fff;box-shadow:0 0 0 4px #e5432f}
.grp{margin:10px 0 2px -20px;padding:4px 10px;background:#f2a900;color:#0e1a3a;font-weight:700;font-size:12px;border-radius:4px}
.sub{margin-left:12px;border-left:6px solid #f2a900;padding-left:16px}.sub::before{border-color:#f2a900}.ghost{opacity:.45}
.dots{display:flex;gap:8px}.dots span{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;color:#0e1a3a}
.dots span:nth-child(1){background:#e5432f}.dots span:nth-child(2){background:#2f7de5;outline:2px solid #fff}.dots span:nth-child(3){background:#2fb36b}
.foot{text-align:center;letter-spacing:10px;opacity:.7}main{position:absolute;left:236px;top:0;right:0;bottom:0;padding:12px 12px 12px 0}
.card{height:100%;border-radius:10px;background:#f4f7ff;color:#0e1a3a;padding:120px 220px}
h1{font-size:34px;margin-bottom:18px}p{font-size:16px;max-width:520px;margin-bottom:12px}.d{opacity:.6}
</style></head><body><aside><div class="bar"><u>←</u><u>→</u><u>↻</u><em>example.com</em><u>☆</u></div>
<nav><div class="tab act"><i>◉</i><span>Example Domain</span></div><div class="tab"><i>▣</i><span>Docs · Chromium views</span></div><div class="tab"><i>✉</i><span>Inbox (3)</span></div><div class="grp"><b>Research</b></div><div class="tab sub"><i>◆</i><span>Hyprland wiki</span></div><div class="tab sub"><i>✎</i><span>Research notes</span></div><div class="tab ghost"><i>+</i><span>New Tab</span></div></nav><div class="dots"><span>Home</span><span>Work</span><span>Play</span></div><div class="foot">⊞ ⚙ ⧉ ⤓ ↺ ▤</div></aside><main><div class="card"><h1>Example Domain</h1>
<p>This domain is for use in documentation examples without needing permission.</p>
<p class="d">Avoid use in operations. Learn more at the registry.</p></div></main></body></html>
