<!doctype html>
<html lang="en"><meta charset="utf-8"><title>New tab mock v3</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* --seed is the single wallpaper colour (the browser already derives it for the theme); everything else is mixed from it.
   Try other values: the whole page follows. */
:root{--seed:#8a7bff;--ink:#f3f2fa;--bg:color-mix(in oklab,var(--seed) 8%,#07070b)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{color:var(--ink);font:15px/1.4 system-ui,sans-serif;overflow:hidden;background:var(--bg)}
.glow{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(60% 55% at 50% 38%,color-mix(in oklab,var(--seed) 34%,transparent),transparent 70%),
             radial-gradient(40% 40% at 90% 100%,color-mix(in oklab,var(--seed) 18%,transparent),transparent 70%)}
main{position:relative;height:100%;display:grid;place-items:center;text-align:center}
.hero{display:grid;gap:12px;justify-items:center;margin-top:-5vh}
.mark{width:64px;height:64px;border-radius:20px;transform:rotate(45deg) scale(.78);margin-bottom:22px;
  background:linear-gradient(145deg,color-mix(in oklab,var(--seed) 70%,#fff),color-mix(in oklab,var(--seed) 80%,#000));
  box-shadow:0 10px 24px #0007,inset 0 2px #fff6}
.hi{font-size:14px;opacity:.88}
h1{font-size:clamp(34px,4.6vw,52px);font-weight:600;letter-spacing:-.02em}
form{position:relative;width:min(560px,88vw);margin-top:20px}
input{width:100%;height:54px;padding:0 70px 0 24px;border-radius:999px;border:0;color:inherit;font:inherit;outline:0;
  background:color-mix(in oklab,var(--seed) 10%,#0000);
  box-shadow:inset 0 0 0 1px #fff2,0 12px 40px #0006;backdrop-filter:blur(16px);transition:box-shadow .15s}
input::placeholder{color:#fffa}
input:focus{box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--seed) 65%,#fff),0 0 0 5px color-mix(in oklab,var(--seed) 25%,transparent),0 12px 40px #0006}
button{position:absolute;right:7px;top:7px;width:40px;height:40px;border:0;border-radius:50%;background:#fff;color:#111;cursor:pointer;display:grid;place-items:center;transition:transform .12s}
button:hover{transform:scale(1.07)}
button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tiles{display:flex;gap:14px;margin-top:34px}
.tile{width:68px;color:inherit;text-decoration:none;font-size:12px;opacity:.9}
.tile i{display:grid;place-items:center;width:50px;height:50px;margin:0 auto 7px;border-radius:16px;font:600 18px system-ui;font-style:normal;
  background:color-mix(in oklab,var(--seed) 12%,#0000);box-shadow:inset 0 0 0 1px #fff2;transition:transform .15s,background .15s}
.tile:hover i{transform:translateY(-3px);background:color-mix(in oklab,var(--seed) 26%,#0000)}
.tile.add i{box-shadow:inset 0 0 0 1.5px #fff5;background:none}
</style>
<div class="glow"></div>
<main>
  <div class="hero">
    <div class="mark"></div>
    <div class="hi">Welcome back</div>
    <h1 id="g">Good Evening User!</h1>
    <form><input placeholder="Search now" autofocus>
      <button type="submit" aria-label="Search"><svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button></form>
    <div class="tiles">
      <a class="tile" href="#"><i>W</i>Wikipedia</a>
      <a class="tile" href="#"><i>G</i>GitHub</a>
      <a class="tile add" href="#"><i>+</i>Add shortcut</a>
    </div>
  </div>
</main>
<script>
const h=new Date().getHours();
g.textContent=(h<5?'Good Night':h<12?'Good Morning':h<18?'Good Afternoon':'Good Evening')+' User!';
</script>
