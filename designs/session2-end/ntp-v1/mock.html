<!doctype html>
<html lang="en"><meta charset="utf-8"><title>New tab mock v1</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* Tokens stand in for the wallpaper-derived theme; the real page reads them from the browser theme. */
:root{--card:#2e2f33;--card2:#383a40;--text:#ecebf4;--dim:#bdbccd;--accent:#b9b8ff;--on-accent:#1d1b3a}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--card);color:var(--text);font:15px/1.4 system-ui,sans-serif}
main{width:min(640px,88vw);display:grid;gap:40px;justify-items:center;margin-top:-6vh}
.clock{text-align:center}
.clock b{display:block;font-size:84px;font-weight:300;letter-spacing:-2px;line-height:1}
.clock span{color:var(--dim);font-size:16px}
form{width:100%}
input{width:100%;box-sizing:border-box;padding:15px 22px;border-radius:999px;border:1px solid transparent;background:var(--card2);color:var(--text);font:inherit;outline:0;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:var(--dim)}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.tiles{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.tile{width:76px;text-align:center;color:var(--dim);font-size:12px;text-decoration:none}
.tile i{display:grid;place-items:center;width:60px;height:60px;margin:0 auto 8px;border-radius:18px;background:var(--card2);color:var(--text);font:600 22px system-ui;font-style:normal;transition:transform .15s,background .15s}
.tile:hover i{transform:translateY(-3px);background:color-mix(in srgb,var(--accent) 24%,var(--card2))}
.tile.add i{background:transparent;border:1.5px dashed var(--dim);color:var(--dim)}
</style>
<main>
  <div class="clock"><b id="t">12:00</b><span id="d"></span></div>
  <form><input placeholder="Search privately or enter address" autofocus></form>
  <div class="tiles">
    <a class="tile" href="#"><i>W</i>Wikipedia</a>
    <a class="tile" href="#"><i>G</i>GitHub</a>
    <a class="tile" href="#"><i>Y</i>YouTube</a>
    <a class="tile add" href="#"><i>+</i>Add shortcut</a>
  </div>
</main>
<script>
const n=new Date();
t.textContent=n.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
d.textContent=n.toLocaleDateString([], {weekday:'long',day:'numeric',month:'long'});
</script>
