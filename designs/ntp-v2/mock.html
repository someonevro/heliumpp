<!doctype html>
<html lang="en"><meta charset="utf-8"><title>New tab mock v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* Same language as designs/session1-end/zen-like-mock: glass panels, 14px radius, soft inset highlights.
   --c1/--c2 stand in for the wallpaper colour; the real page shows the wallpaper itself behind a scrim. */
:root{--c1:#d9774a;--c2:#4a3b7a;--ink:#f6f2ee;--r:14px}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{color:var(--ink);font:15px/1.4 system-ui,sans-serif;overflow:hidden;
  background:
    radial-gradient(120% 80% at 70% 100%,color-mix(in oklab,var(--c1) 55%,#000) 0,transparent 60%),
    linear-gradient(160deg,color-mix(in oklab,var(--c2) 70%,#000),color-mix(in oklab,var(--c1) 40%,#0b0b0e))}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(#0004,#0008)} /* scrim keeps text readable on any wallpaper */
main{position:relative;height:100%;display:grid;place-items:center;text-align:center}
.hero{display:grid;gap:10px;justify-items:center;margin-top:-4vh}
h1{font-size:clamp(34px,5.4vw,64px);font-weight:500;letter-spacing:-.02em;text-shadow:0 2px 24px #0005}
.sub{font-size:clamp(16px,1.8vw,22px);opacity:.95}
form{width:min(520px,86vw);margin-top:22px}
input{width:100%;padding:14px 22px;border-radius:999px;border:0;color:inherit;font:inherit;outline:0;
  background:color-mix(in oklab,#000 28%,transparent);backdrop-filter:blur(14px);
  box-shadow:inset 0 0 0 1px #fff2,inset 0 1px #fff2;transition:box-shadow .15s}
input::placeholder{color:#fffe}
input:focus{box-shadow:inset 0 0 0 1.5px #fffd,0 0 0 5px #fff2}
.hint{margin-top:14px;font-size:13px;opacity:.9;text-shadow:0 1px 8px #0006}
kbd{padding:2px 7px;border-radius:7px;background:#fff2;font:inherit;font-size:12px}
.tiles{display:flex;gap:16px;margin-top:26px}
.tile{width:72px;color:inherit;text-decoration:none;font-size:12px;text-shadow:0 1px 8px #0008}
.tile i{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 7px;border-radius:17px;font:600 20px system-ui;font-style:normal;
  background:color-mix(in oklab,#000 26%,transparent);box-shadow:inset 0 1px #fff2,inset 0 0 0 1px #fff1;transition:transform .15s,background .15s}
.tile:hover i{transform:translateY(-3px);background:#fff3}
.tile.add i{background:transparent;box-shadow:inset 0 0 0 1.5px #fff6}
.chips{position:fixed;right:22px;bottom:22px;display:grid;gap:8px;text-align:left}
.chip{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:var(--r);font-size:13px;
  background:color-mix(in oklab,#000 30%,transparent);backdrop-filter:blur(14px);box-shadow:inset 0 1px #fff2,inset 0 0 0 1px #fff1}
.chip svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style>
<main>
  <div class="hero">
    <h1 id="g">Good morning</h1>
    <div class="sub">Where to today?</div>
    <form><input placeholder="Search privately or enter address" autofocus></form>
    <div class="hint"><kbd>Ctrl</kbd> + <kbd>L</kbd> focuses the address bar</div>
    <div class="tiles">
      <a class="tile" href="#"><i>W</i>Wikipedia</a>
      <a class="tile" href="#"><i>G</i>GitHub</a>
      <a class="tile" href="#"><i>Y</i>YouTube</a>
      <a class="tile add" href="#"><i>+</i>Add shortcut</a>
    </div>
  </div>
  <div class="chips">
    <div class="chip"><svg viewBox="0 0 16 16"><path d="M8 1.5 13.5 4v4c0 3-2.3 5.2-5.5 6.5C4.8 13.2 2.5 11 2.5 8V4z"/></svg>Privacy: Medium</div>
    <div class="chip"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="m4 4 8 8"/></svg>128 trackers blocked today</div>
  </div>
</main>
<script>
const h=new Date().getHours();
g.textContent=h<5?'Good night':h<12?'Good morning':h<18?'Good afternoon':'Good evening';
</script>
